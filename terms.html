<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="favicon.ico" sizes="any">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="page-simple">
<header class="navbar">

    <div class="lang-switch" role="group" aria-label="Language">

      <button class="lang-btn" type="button" data-lang="es">ES</button>

  </div>

<main class="simple-main">

    <span class="overline" data-i18n="legal.overline">Legal</span>

<footer class="footer footer-simple">
  <div class="container footer-bottom">
    <p data-i18n="footer.copyright"></p>
    <div class="footer-legal">
      <a href="terms.html" class="underline" data-i18n="footer.terms"></a>
      <a href="privacy.html" class="underline" data-i18n="footer.privacy"></a>
    </div>
  </div>
</footer>

<script src="public/assets/scripts/translations/en.js"></script>
<script src="public/assets/scripts/translations/es.js"></script>
